<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dusk — Nocturne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ground:#0b0806; --ink:#f6ecdd; --muted:#c7a98a; --accent:#f4a24c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--ground); color:var(--ink); overflow:hidden;
         font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  #scene { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  #src { position:fixed; width:2px; height:2px; opacity:0; left:-10px; top:-10px; pointer-events:none; }

  /* Legibility scrim: darkest at lower-left (where the headline sits over the
     tree's void), fading out toward the bright sky on the right. */
  .scrim { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(75deg, rgba(11,8,6,.92) 0%, rgba(11,8,6,.6) 30%, rgba(11,8,6,.08) 58%, rgba(11,8,6,0) 78%),
      linear-gradient(to top, rgba(11,8,6,.8) 0%, rgba(11,8,6,0) 42%); }

  .stage { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
           justify-content:space-between; padding:clamp(20px,4vw,52px); }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:11px; font-family:"Fraunces",serif;
           font-weight:600; letter-spacing:.02em; font-size:19px; }
  .mark { width:13px; height:13px; border-radius:50%;
          background:radial-gradient(circle at 34% 30%, #ffe3b8, var(--accent) 60%, #a85a17);
          box-shadow:0 0 20px rgba(244,162,76,.6); }
  .nav { display:flex; gap:28px; font-size:13px; color:var(--muted); }
  .nav a { color:inherit; text-decoration:none; }
  .nav a:hover { color:var(--ink); }

  .hero { max-width:min(660px,84vw); }
  .eyebrow { color:var(--accent); font-size:13px; letter-spacing:.26em; text-transform:uppercase;
             font-weight:600; margin-bottom:20px; }
  h1 { font-family:"Fraunces",serif; font-size:clamp(40px,7.6vw,104px); line-height:.98;
       font-weight:600; letter-spacing:-.015em; text-shadow:0 2px 44px rgba(0,0,0,.6); }
  h1 .thin { font-style:italic; font-weight:400; color:var(--muted); }
  .sub { margin-top:24px; max-width:44ch; color:var(--muted); font-size:clamp(15px,1.5vw,18px);
         line-height:1.6; }
  .cta { display:inline-flex; align-items:center; gap:12px; margin-top:36px; padding:14px 28px;
         border-radius:999px; background:var(--accent); color:#2a1405; font-weight:600; font-size:15px;
         text-decoration:none; box-shadow:0 8px 32px rgba(244,162,76,.38); transition:transform .2s,box-shadow .2s; }
  .cta:hover { transform:translateY(-2px); box-shadow:0 12px 44px rgba(244,162,76,.52); }
  .cta .arrow { transition:transform .2s; } .cta:hover .arrow { transform:translateX(4px); }

  .styles { position:fixed; right:clamp(20px,4vw,52px); bottom:clamp(20px,4vw,52px); z-index:3;
            font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
            text-decoration:none; border:1px solid rgba(199,169,138,.32); padding:8px 14px; border-radius:999px; }
  .styles:hover { color:var(--ink); border-color:var(--ink); }
  @media (max-width:640px){ .nav,.sub{ display:none; } }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <video id="src" src="assets/tree.mp4" muted loop playsinline preload="auto" crossorigin="anonymous"></video>
  <div class="scrim"></div>
  <div class="stage">
    <header class="top">
      <div class="brand"><span class="mark"></span> Nocturne</div>
      <nav class="nav"><a href="#">Seasons</a><a href="#">Sessions</a><a href="#">Field notes</a><a href="#">Listen</a></nav>
    </header>
    <section class="hero">
      <div class="eyebrow">Recorded in open air</div>
      <h1>Where the last<br><span class="thin">light plays.</span></h1>
      <p class="sub">An album of one afternoon — a piano left standing under a turning tree,
      the wind carrying every note out across the field before the dark comes in.</p>
      <a class="cta" href="#">Hear the session <span class="arrow">→</span></a>
    </section>
  </div>
  <a class="styles" href="tree-index.html">◂ Styles</a>
  <script>
    window.__dither = {
      colorMode:'sampled',            // let the scene's own amber / sky-blue carry the palette
      ground:[11,8,6],                // warm near-black backdrop
      shape:'circle',
      warp:'lean', pointerLean:11,    // wind through the leaves, not a vortex twist
      pointerRadiusFrac:0.55,
      pixelSize:10, levels:5,
      invert:false,                   // dark trunk -> void; bright sky + leaves -> dots
      floor:0.10, gamma:0.9, contrast:24, brightness:0,
      zoom:1.06, offsetX:0.44, offsetY:0.5,
      loopCrossfade:1.5,              // scene light drifts over the clip -> mask the wrap
    };
  </script>
  <script src="dither.js"></script>
</body>
</html>
