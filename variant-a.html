<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Singularity — Aphelion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ground:#07080f; --ink:#ecebff; --muted:#9a94c8; --accent:#8f7bff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--ground); color:var(--ink); overflow:hidden;
         font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  #scene { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  #src { position:fixed; width:2px; height:2px; opacity:0; left:-10px; top:-10px; pointer-events:none; }
  .scrim { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(105deg, rgba(7,8,15,.9) 0%, rgba(7,8,15,.68) 26%, rgba(7,8,15,.16) 52%, rgba(7,8,15,0) 72%),
      linear-gradient(to top, rgba(7,8,15,.74) 0%, rgba(7,8,15,0) 40%); }
  .stage { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
           justify-content:space-between; padding:clamp(20px,4vw,48px); }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; font-family:"Space Grotesk",sans-serif;
           font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:14px; }
  .mark { width:12px; height:12px; border-radius:50%;
          background:radial-gradient(circle at 32% 30%, #d8ccff, var(--accent) 58%, #4a2f9a);
          box-shadow:0 0 18px rgba(143,123,255,.65); }
  .nav { display:flex; gap:26px; font-size:13px; color:var(--muted); }
  .nav a { color:inherit; text-decoration:none; }
  .nav a:hover { color:var(--ink); }
  .hero { max-width:min(680px,82vw); }
  .eyebrow { color:var(--accent); font-size:13px; letter-spacing:.24em; text-transform:uppercase;
             font-weight:600; margin-bottom:18px; }
  h1 { font-family:"Space Grotesk",sans-serif; font-size:clamp(38px,7.4vw,96px); line-height:.96;
       font-weight:700; letter-spacing:-.02em; text-shadow:0 2px 40px rgba(0,0,0,.55); }
  h1 .thin { font-weight:400; color:var(--muted); }
  .sub { margin-top:22px; max-width:46ch; color:var(--muted); font-size:clamp(15px,1.5vw,18px); line-height:1.55; }
  .cta { display:inline-flex; align-items:center; gap:12px; margin-top:34px; padding:14px 26px;
         border-radius:999px; background:var(--accent); color:#0a0518; font-weight:600; font-size:15px;
         text-decoration:none; box-shadow:0 8px 30px rgba(143,123,255,.4); transition:transform .2s,box-shadow .2s; }
  .cta:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(143,123,255,.55); }
  .cta .arrow { transition:transform .2s; } .cta:hover .arrow { transform:translateX(4px); }
  .styles { position:fixed; right:clamp(20px,4vw,48px); bottom:clamp(20px,4vw,48px); z-index:3;
            font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
            text-decoration:none; border:1px solid rgba(143,166,200,.3); padding:8px 14px; border-radius:999px; }
  .styles:hover { color:var(--ink); border-color:var(--ink); }
  @media (max-width:640px){ .nav,.sub{ display:none; } }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <video id="src" src="assets/source.mp4" muted loop playsinline preload="auto"></video>
  <div class="scrim"></div>
  <div class="stage">
    <header class="top">
      <div class="brand"><span class="mark"></span> Aphelion</div>
      <nav class="nav"><a href="#">Gateways</a><a href="#">Transit</a><a href="#">Horizon</a><a href="#">Contact</a></nav>
    </header>
    <section class="hero">
      <div class="eyebrow">Faster-than-light transit</div>
      <h1>Cross the<br><span class="thin">event horizon.</span></h1>
      <p class="sub">A network that folds the distance between two points into a single bright
      throat of light. Step through anywhere, arrive everywhere — the gateway never stops turning.</p>
      <a class="cta" href="#">Open a gateway <span class="arrow">→</span></a>
    </section>
  </div>
  <a class="styles" href="aphelion.html">◂ Styles</a>
  <script>
    window.__dither = {
      colorMode:'blend', colorMix:0.35, accent:[143,123,255], ground:[7,8,15],
      shape:'circle', warp:'twist', pointerTwist:1.0,
      pixelSize:9, levels:5, contrast:34, brightness:8, floor:0.035,
      zoom:1.2, offsetX:0.62, offsetY:0.5,
    };
  </script>
  <script src="dither.js"></script>
</body>
</html>
