<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Broadcast — Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ground:#0b0b0d; --ink:#f5f3ee; --accent:#ff5722; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--ground); color:var(--ink); overflow:hidden;
         font-family:"Space Grotesk",sans-serif; -webkit-font-smoothing:antialiased; }
  #scene { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  #src { position:fixed; width:2px; height:2px; opacity:0; left:-10px; top:-10px; pointer-events:none; }
  .stage { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; justify-content:space-between; padding:clamp(18px,3.5vw,40px);
         font-size:12px; letter-spacing:.2em; text-transform:uppercase; }
  .top .live { display:flex; align-items:center; gap:9px; color:var(--accent); font-weight:700; }
  .top .live .dot { width:9px; height:9px; border-radius:50%; background:var(--accent);
                    box-shadow:0 0 12px var(--accent); animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .top .rt { color:#8c887f; }
  .band { padding:clamp(26px,4vw,54px) clamp(20px,4vw,48px) clamp(24px,3.5vw,44px);
          background:linear-gradient(to top, #0b0b0d 62%, rgba(11,11,13,0) 100%); }
  h1 { font-family:"Anton",Impact,sans-serif; font-weight:400; text-transform:uppercase;
       font-size:clamp(48px,11vw,150px); line-height:.86; letter-spacing:.005em; }
  h1 .hot { color:var(--accent); }
  .row { display:flex; align-items:flex-end; justify-content:space-between; gap:30px; flex-wrap:wrap; margin-top:22px; }
  .sub { max-width:42ch; color:#b9b5ac; font-size:clamp(14px,1.4vw,17px); line-height:1.5; }
  .cta { flex:none; display:inline-flex; align-items:center; gap:10px; padding:15px 30px; background:var(--accent);
         color:#160a04; font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:14px;
         text-decoration:none; transition:transform .15s; }
  .cta:hover { transform:translateY(-2px); }
  .styles { position:fixed; right:clamp(18px,3.5vw,40px); top:clamp(48px,10vw,90px); z-index:3;
            font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#8c887f; text-decoration:none; }
  .styles:hover { color:var(--ink); }
  @media (max-width:640px){ .sub{ display:none; } }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <video id="src" src="assets/rotatingearth.mp4" muted loop playsinline preload="auto"></video>
  <div class="stage">
    <header class="top">
      <span class="live"><span class="dot"></span> On air · worldwide</span>
      <span class="rt">Meridian — Signal 24/7</span>
    </header>
    <div class="band">
      <h1>Broadcasting<br>the planet, <span class="hot">live.</span></h1>
      <div class="row">
        <p class="sub">Every rotation, relayed in real time. A single feed for the whole
        turning world — no gaps, no downtime, no dark side left unseen.</p>
        <a class="cta" href="#">Watch live ▸</a>
      </div>
    </div>
  </div>
  <a class="styles" href="earth-index.html">◂ Styles</a>
  <script>
    window.__dither = {
      colorMode:'duotone', accent:[255,87,34], ground:[11,11,13],
      shape:'square', warp:'lean', pointerLean:10,
      pixelSize:12, dotScale:0.92, spacing:0.32, levels:3,
      contrast:42, brightness:4, floor:0.045, gamma:0.85,
      zoom:1.7, offsetX:0.5, offsetY:0.42,
    };
  </script>
  <script src="dither.js"></script>
</body>
</html>
