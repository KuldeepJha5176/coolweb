<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Orbit — Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ground:#050810; --ink:#eaf2ff; --muted:#8fa6c8; --accent:#68c2ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--ground); color:var(--ink); overflow:hidden;
         font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  #scene { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  #src { position:fixed; width:2px; height:2px; opacity:0; left:-10px; top:-10px; pointer-events:none; }
  .scrim { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(105deg, rgba(5,8,16,.88) 0%, rgba(5,8,16,.66) 26%, rgba(5,8,16,.16) 52%, rgba(5,8,16,0) 72%),
      linear-gradient(to top, rgba(5,8,16,.72) 0%, rgba(5,8,16,0) 40%); }
  .stage { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
           justify-content:space-between; padding:clamp(20px,4vw,48px); }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; font-family:"Space Grotesk",sans-serif;
           font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:14px; }
  .mark { width:12px; height:12px; border-radius:50%;
          background:radial-gradient(circle at 32% 30%, #bfe4ff, var(--accent) 60%, #2f6fa8);
          box-shadow:0 0 18px rgba(104,194,255,.6); }
  .nav { display:flex; gap:26px; font-size:13px; color:var(--muted); }
  .nav a { color:inherit; text-decoration:none; } .nav a:hover { color:var(--ink); }
  .hero { max-width:min(680px,82vw); }
  .eyebrow { color:var(--accent); font-size:13px; letter-spacing:.24em; text-transform:uppercase;
             font-weight:600; margin-bottom:18px; }
  h1 { font-family:"Space Grotesk",sans-serif; font-size:clamp(38px,7.4vw,96px); line-height:.96;
       font-weight:700; letter-spacing:-.02em; text-shadow:0 2px 40px rgba(0,0,0,.55); }
  h1 .thin { font-weight:400; color:var(--muted); }
  .sub { margin-top:22px; max-width:46ch; color:var(--muted); font-size:clamp(15px,1.5vw,18px); line-height:1.55; }
  .cta { display:inline-flex; align-items:center; gap:12px; margin-top:34px; padding:14px 26px;
         border-radius:999px; background:var(--accent); color:#04121f; font-weight:600; font-size:15px;
         text-decoration:none; box-shadow:0 8px 30px rgba(104,194,255,.35); transition:transform .2s,box-shadow .2s; }
  .cta:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(104,194,255,.5); }
  .cta .arrow { transition:transform .2s; } .cta:hover .arrow { transform:translateX(4px); }
  .styles { position:fixed; right:clamp(20px,4vw,48px); bottom:clamp(20px,4vw,48px); z-index:3;
            font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
            text-decoration:none; border:1px solid rgba(143,166,200,.3); padding:8px 14px; border-radius:999px; }
  .styles:hover { color:var(--ink); border-color:var(--ink); }
  @media (max-width:640px){ .nav,.sub{ display:none; } }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <video id="src" src="assets/rotatingearth.mp4" muted loop playsinline preload="auto"></video>
  <div class="scrim"></div>
  <div class="stage">
    <header class="top">
      <div class="brand"><span class="mark"></span> Meridian</div>
      <nav class="nav"><a href="#">Platform</a><a href="#">Coverage</a><a href="#">Network</a><a href="#">Contact</a></nav>
    </header>
    <section class="hero">
      <div class="eyebrow">Global infrastructure</div>
      <h1>The whole world,<br><span class="thin">in motion.</span></h1>
      <p class="sub">One resilient network spanning every timezone — routing, sensing and responding
      wherever your work reaches. Built to keep pace with a planet that never stops turning.</p>
      <a class="cta" href="#">Explore the network <span class="arrow">→</span></a>
    </section>
  </div>
  <a class="styles" href="earth-index.html">◂ Styles</a>
  <script>
    window.__dither = {
      colorMode:'blend', colorMix:0.28, accent:[104,194,255], ground:[5,8,16],
      shape:'circle', warp:'twist', pixelSize:9, levels:5,
      contrast:30, brightness:2, floor:0.04, gamma:0.85,
      zoom:1.55, offsetX:0.66, offsetY:0.5,
    };
  </script>
  <script src="dither.js"></script>
</body>
</html>
