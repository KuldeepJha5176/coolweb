<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deep Field — Aphelion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ground:#efe9dc; --ink:#2a2140; --muted:#726a86; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--ground); color:var(--ink); overflow:hidden;
         font-family:"Fraunces",Georgia,serif; -webkit-font-smoothing:antialiased; }
  #scene { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  #src { position:fixed; width:2px; height:2px; opacity:0; left:-10px; top:-10px; pointer-events:none; }
  /* light ground -> a soft vignette keeps the centre focused */
  .scrim { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 46%, rgba(239,233,220,0) 38%, rgba(239,233,220,.6) 100%); }
  .stage { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
           justify-content:space-between; align-items:center; text-align:center;
           padding:clamp(22px,4vw,52px); }
  .top { width:100%; display:flex; align-items:center; justify-content:space-between;
         font-family:"Space Mono",monospace; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .top .wm { color:var(--ink); font-weight:700; letter-spacing:.28em; }
  /* type multiplies into the dot field — works because the ground is light */
  .hero { mix-blend-mode:multiply; max-width:min(900px,90vw); margin-bottom:2vh; }
  .label { font-family:"Space Mono",monospace; font-size:12px; letter-spacing:.32em; text-transform:uppercase;
           color:var(--muted); margin-bottom:20px; }
  h1 { font-size:clamp(40px,8.4vw,110px); line-height:.98; font-weight:600; letter-spacing:-.01em; }
  h1 em { font-style:italic; font-weight:400; }
  .rule { width:64px; height:1px; background:var(--ink); opacity:.5; margin:26px auto; }
  .sub { max-width:52ch; margin:0 auto; font-size:clamp(15px,1.5vw,18px); line-height:1.6; color:#463c5a; }
  .cta { display:inline-block; margin-top:30px; font-family:"Space Mono",monospace; font-size:13px;
         letter-spacing:.14em; text-transform:uppercase; color:var(--ink); text-decoration:none;
         border-bottom:2px solid var(--ink); padding-bottom:4px; }
  .styles { position:fixed; left:50%; transform:translateX(-50%); bottom:clamp(18px,3vw,34px); z-index:3;
            font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
            color:var(--muted); text-decoration:none; }
  .styles:hover { color:var(--ink); }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <video id="src" src="assets/source.mp4" muted loop playsinline preload="auto"></video>
  <div class="scrim"></div>
  <div class="stage">
    <header class="top"><span class="wm">Aphelion</span><span>Deep Field Register — 001</span></header>
    <section class="hero">
      <div class="label">A field guide to the deep sky</div>
      <h1>Notes from<br><em>beyond the veil</em></h1>
      <div class="rule"></div>
      <p class="sub">Observations, coordinates and quiet wonder from the edge of a collapsing
      star — set down here in ink and dots, one revolution of the throat at a time.</p>
      <a class="cta" href="#">Read the field log →</a>
    </section>
    <span></span>
  </div>
  <a class="styles" href="aphelion.html">◂ Styles</a>
  <script>
    window.__dither = {
      colorMode:'duotone', accent:[42,33,64], ground:[239,233,220],
      shape:'circle', warp:'twist', pointerTwist:0.9,
      pixelSize:13, dotScale:0.7, spacing:0.48, levels:4,
      contrast:28, brightness:4, floor:0.07, gamma:0.92,
      zoom:1.14, offsetX:0.5, offsetY:0.5,
    };
  </script>
  <script src="dither.js"></script>
</body>
</html>
